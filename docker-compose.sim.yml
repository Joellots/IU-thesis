# Local detection-side simulation override (non-destructive).
# Usage: docker compose -f docker-compose.yml -f docker-compose.sim.yml up …
# Replays a finite batch from training_dataset.csv so the detection pipeline
# produces annotated `alerts` rows (with ja3 observables, mapping_*, mitre_ttps).
# The SOAR orchestrator that consumes them runs on the SOAR machine (not here).
services:
  producer:
    environment:
      LABEL_COL: "true_label"      # training_dataset.csv uses true_label, not label
      BATCH_SIZE: "40"             # finite batch for an observable run
      LOOP: "false"
      STREAM_DELAY_MS: "300"
      MALICIOUS_RATIO: "0.5"       # mix of malicious (C2/exfil) + benign
