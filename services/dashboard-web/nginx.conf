server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live-updates WebSocket (must come before /api/ for the upgrade handling).
    location /api/ws {
        proxy_pass http://dashboard:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Reverse-proxy the JSON API to the FastAPI dashboard backend (same compose net).
    location /api/ {
        proxy_pass http://dashboard:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
