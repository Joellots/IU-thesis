# argus.conf — tuned for ML feature extraction from PCAP files
# Reference: https://manpages.ubuntu.com/manpages/bionic/man5/argus.conf.5.html

# ── Flow identification ───────────────────────────────────────────────────────
# Bidirectional classic 5-tuple: most consistent with CICFlowMeter
ARGUS_FLOW_TYPE="Bidirectional"
ARGUS_FLOW_KEY="CLASSIC_5_TUPLE"

# ── Flow timeouts ─────────────────────────────────────────────────────────────
# Close flows on TCP FIN/RST — critical for correct per-flow feature computation
# Matches CICFlowMeter behaviour
ARGUS_FLOW_STATUS_INTERVAL=5
ARGUS_FLOW_TIMEOUT=60

# ── IAT and timing ────────────────────────────────────────────────────────────
# Enable jitter computation (standard deviation of IAT)
ARGUS_KEYSTROKE="no"

# ── Output options ────────────────────────────────────────────────────────────
# Do not run as daemon when reading from PCAP files
ARGUS_DAEMON=no

# Access port disabled for PCAP-mode experimentation
ARGUS_ACCESS_PORT=0